<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Polyphonic Analysis Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0a0a0a 100%);
        }

        .left-panel-bg {
            background: url('assets/images/4.jpg') center/cover;
            position: relative;
        }

        .left-panel-bg::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 0;
        }

        .left-panel-bg > * {
            position: relative;
            z-index: 1;
        }

        .right-panel-bg {
            background: url('') center/cover;
            position: relative;
        }

        .right-panel-bg::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 0;
        }

        .right-panel-bg > * {
            position: relative;
            z-index: 1;
        }

        .glass-effect {
            background: rgba(17, 17, 17, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 255, 0, 0.1);
        }

        .stem-player {
            background: linear-gradient(135deg, rgba(0, 255, 0, 0.03) 0%, rgba(0, 0, 0, 0.5) 100%);
            border: 2px solid rgba(0, 255, 0, 0.2);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .stem-player:hover {
            border-color: rgba(0, 255, 0, 0.5);
            box-shadow: 0 8px 32px rgba(0, 255, 0, 0.2);
            transform: translateY(-2px);
        }

        .stem-player.playing {
            background: linear-gradient(135deg, rgba(0, 255, 0, 0.08) 0%, rgba(0, 255, 0, 0.03) 100%);
            border-color: #00FF00;
            box-shadow: 0 0 40px rgba(0, 255, 0, 0.4), inset 0 0 20px rgba(0, 255, 0, 0.1);
        }

        .instrument-icon-large {
            font-size: 120px;
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.3));
            transition: all 0.5s ease;
        }

        .instrument-icon-large.playing {
            filter: drop-shadow(0 0 40px #00FF00);
            animation: icon-glow 2s ease-in-out infinite;
        }

        @keyframes icon-glow {
            0%, 100% {
                transform: scale(1);
                filter: drop-shadow(0 0 40px #00FF00);
            }
            50% {
                transform: scale(1.1);
                filter: drop-shadow(0 0 60px #00FF00);
            }
        }

        .waveform-visualizer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            height: 60px;
            margin: 20px 0;
        }

        .wave-bar {
            width: 4px;
            background: linear-gradient(to top, #00FF00, rgba(0, 255, 0, 0.3));
            border-radius: 2px;
            transition: height 0.1s ease;
        }

        .wave-bar.active {
            animation: wave-pulse 0.8s ease-in-out infinite;
        }

        @keyframes wave-pulse {
            0%, 100% { height: 20%; }
            50% { height: 100%; }
        }

        .custom-audio-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 0, 0.15);
        }

        .play-button {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00FF00, #00CC00);
            border: none;
            color: #000;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(0, 255, 0, 0.3);
        }

        .play-button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 255, 0, 0.5);
        }

        .play-button:active {
            transform: scale(0.95);
        }

        .progress-container {
            flex: 1;
            height: 6px;
            background: rgba(0, 255, 0, 0.1);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #00FF00, #00CC00);
            border-radius: 3px;
            transition: width 0.1s linear;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        .time-display {
            font-size: 12px;
            color: white;
            font-weight: 500;
            min-width: 80px;
            text-align: center;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .volume-slider {
            width: 80px;
            height: 4px;
            background: rgba(0, 255, 0, 0.2);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        .volume-level {
            height: 100%;
            background: #00FF00;
            border-radius: 2px;
            transition: width 0.1s;
        }

        .back-button {
            position: fixed;
            bottom: 30px;
            left: 30px;
            z-index: 1001;
            padding: 12px 24px;
            background: rgba(0, 255, 0, 0.1);
            backdrop-filter: blur(10px);
            color: #00FF00;
            border: 2px solid #00FF00;
            border-radius: 50px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }

        .back-button:hover {
            background: #00FF00;
            color: #000000;
            transform: translateX(-5px);
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.6);
        }

        .scrollbar-custom::-webkit-scrollbar {
            width: 8px;
        }

        .scrollbar-custom::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }

        .scrollbar-custom::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 0, 0.3);
            border-radius: 4px;
        }

        .scrollbar-custom::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 255, 0, 0.5);
        }

        .badge {
            background: rgba(0, 255, 0, 0.15);
            border: 1px solid rgba(0, 255, 0, 0.3);
        }
    </style>
</head>
<body class="h-screen overflow-hidden">

<div class="flex h-screen">
    <!-- Left Panel - Stems (50% width) -->
    <div class="w-1/2 left-panel-bg flex flex-col border-r border-green-500/20">
        <!-- Header -->
        <div class="p-8 border-b border-green-500/20">
            <div class="flex items-center space-x-4 mb-3">
                
                <div>
                    <h1 class="text-3xl font-bold" style="color: white;">Polyphonic Transcription</h1>
                    <p class="text-sm" style="color: white; opacity: 0.7;">Professional Stem Separation & Analysis</p>
                </div>
            </div>
        </div>

        <!-- Control Panel -->
        <div class="p-8 border-b border-green-500/20">
            <button id="analyzeBtn" 
                    class="w-full text-black font-semibold py-4 px-8 rounded-xl transition-all duration-300 transform hover:scale-105 flex items-center justify-center space-x-3 text-lg"
                    style="background: #00FF00; box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);">
                <span class="text-2xl">▶</span>
                <span>Separate Audio Stems</span>
            </button>

            <div id="status" class="hidden mt-6 p-4 rounded-xl glass-effect border border-green-500/30 text-center">
                <div class="flex items-center justify-center space-x-3">
                    <div class="w-3 h-3 rounded-full animate-pulse" style="background: #00FF00;"></div>
                    <span id="statusText" class="font-medium text-lg" style="color: #00FF00;"></span>
                </div>
            </div>
        </div>

        <!-- Stems List -->
        <div id="stemsContainer" class="flex-1 overflow-y-auto scrollbar-custom p-8 space-y-6">
            <!-- Stems will be populated here -->
        </div>
    </div>

    <!-- Right Panel - Visualization (50% width) -->
    <div class="w-1/2 right-panel-bg flex flex-col">
        <!-- Top Bar -->
        <div class="glass-effect border-b border-green-500/20 p-8">
            <div class="flex items-center justify-between">
                <div>
                    <h2 class="text-2xl font-semibold" style="color: white;">Live Visualization</h2>
                    <p class="text-sm mt-2" style="color: white; opacity: 0.7;">Real-time audio stem display</p>
                </div>
                <div id="currentStemBadge" class="hidden px-6 py-3 rounded-full badge">
                    <span class="text-sm font-medium" style="color: #00FF00;">● PLAYING</span>
                </div>
            </div>
        </div>

        <!-- Visualization Area -->
        <div class="flex-1 flex flex-col items-center justify-center p-12 relative overflow-hidden">
            <!-- Background Effect -->
            <div class="absolute inset-0 opacity-5">
                <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] rounded-full border-2 border-green-500"></div>
                <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] rounded-full border border-green-500"></div>
                <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[400px] h-[400px] rounded-full border border-green-500"></div>
            </div>

            <!-- Main Icon Display -->
            <div class="relative z-10 text-center">
                <div id="visualizerIcon" class="instrument-icon-large mb-8">
                    <span id="iconDisplay">🎼</span>
                </div>
                
                <h3 id="stemTitle" class="text-3xl font-bold mb-4" style="color: white;">Ready to Analyze</h3>
                <p id="stemSubtitle" class="text-lg" style="color: white; opacity: 0.7;">Select "Separate Audio Stems" to begin processing</p>

                <!-- Waveform Visualizer -->
                <div id="waveformContainer" class="hidden waveform-visualizer mt-8">
                    <div class="wave-bar" style="animation-delay: 0s;"></div>
                    <div class="wave-bar" style="animation-delay: 0.1s;"></div>
                    <div class="wave-bar" style="animation-delay: 0.2s;"></div>
                    <div class="wave-bar" style="animation-delay: 0.3s;"></div>
                    <div class="wave-bar" style="animation-delay: 0.4s;"></div>
                    <div class="wave-bar" style="animation-delay: 0.5s;"></div>
                    <div class="wave-bar" style="animation-delay: 0.4s;"></div>
                    <div class="wave-bar" style="animation-delay: 0.3s;"></div>
                    <div class="wave-bar" style="animation-delay: 0.2s;"></div>
                    <div class="wave-bar" style="animation-delay: 0.1s;"></div>
                </div>

                <!-- Instruments Detected -->
                <div id="instrumentsList" class="hidden mt-8 flex flex-wrap gap-3 justify-center">
                    <!-- Instrument badges will appear here -->
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Back Button (Bottom Left) -->
<button class="back-button" id="backBtn">
    <span class="text-xl">←</span>
    <span>Back to Selection</span>
</button>

<script>
    document.getElementById("backBtn").addEventListener("click", () => {
        document.body.style.opacity = "0.7";
        document.body.style.transition = "opacity 0.3s ease";
        setTimeout(() => {
            window.location.href = "index.html";
        }, 300);
    });

    const params = new URLSearchParams(window.location.search);
    const filename = params.get("file");

    const stemIcons = {
        "drums": "🥁",
        "bass": "🎸",
        "other": "🎹",
        "vocals": "🎤"
    };

    let audioPlayers = {};
    let currentPlayingStem = null;

    function formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    function createCustomPlayer(stemName, audioUrl, instruments) {
        const icon = stemIcons[stemName.toLowerCase()] || "🎵";
        
        const playerDiv = document.createElement("div");
        playerDiv.className = "stem-player rounded-2xl p-6";
        playerDiv.dataset.stem = stemName.toLowerCase();

        let instBadges = "";
        if (instruments && instruments.length) {
            instruments.forEach(i => {
                const confidence = (i.confidence * 100).toFixed(0);
                instBadges += `
                    <span class="inline-flex items-center px-3 py-1.5 rounded-full text-xs font-medium badge mr-2 mb-2" style="color: white;">
                        ${i.instrument} <span class="ml-1.5" style="color: #00FF00;">${confidence}%</span>
                    </span>
                `;
            });
        }

        playerDiv.innerHTML = `
            <div class="flex items-center space-x-4 mb-6">
                <div class="text-6xl">${icon}</div>
                <div class="flex-1">
                    <h3 class="text-2xl font-bold mb-1" style="color: white;">${stemName.toUpperCase()}</h3>
                    <p class="text-sm" style="color: white; opacity: 0.7;">${instruments?.length || 0} instrument${instruments?.length !== 1 ? 's' : ''} detected</p>
                </div>
            </div>
            
            ${instBadges ? `<div class="mb-6 flex flex-wrap">${instBadges}</div>` : ''}

            <div class="custom-audio-controls">
                <button class="play-button">▶</button>
                
                <div class="progress-container">
                    <div class="progress-bar" style="width: 0%"></div>
                </div>
                
                <div class="time-display">0:00 / 0:00</div>
                
                <div class="volume-control">
                    <span style="font-size: 18px;">🔊</span>
                    <div class="volume-slider">
                        <div class="volume-level" style="width: 100%"></div>
                    </div>
                </div>
            </div>
            
            <audio src="${audioUrl}" preload="metadata"></audio>
        `;

        const audio = playerDiv.querySelector("audio");
        const playBtn = playerDiv.querySelector(".play-button");
        const progressBar = playerDiv.querySelector(".progress-bar");
        const progressContainer = playerDiv.querySelector(".progress-container");
        const timeDisplay = playerDiv.querySelector(".time-display");
        const volumeSlider = playerDiv.querySelector(".volume-slider");
        const volumeLevel = playerDiv.querySelector(".volume-level");

        audioPlayers[stemName] = { audio, element: playerDiv, icon, instruments };

        // Play/Pause
        playBtn.addEventListener("click", () => {
            if (audio.paused) {
                Object.values(audioPlayers).forEach(p => {
                    if (p.audio !== audio) {
                        p.audio.pause();
                        p.element.classList.remove("playing");
                        p.element.querySelector(".play-button").textContent = "▶";
                    }
                });
                audio.play();
            } else {
                audio.pause();
            }
        });

        audio.addEventListener("play", () => {
            playBtn.textContent = "⏸";
            playerDiv.classList.add("playing");
            currentPlayingStem = stemName;
            updateVisualization(stemName, icon, instruments);
        });

        audio.addEventListener("pause", () => {
            playBtn.textContent = "▶";
            playerDiv.classList.remove("playing");
            if (currentPlayingStem === stemName) {
                resetVisualization();
            }
        });

        audio.addEventListener("ended", () => {
            playBtn.textContent = "▶";
            playerDiv.classList.remove("playing");
            progressBar.style.width = "0%";
            if (currentPlayingStem === stemName) {
                resetVisualization();
            }
        });

        // Progress
        audio.addEventListener("timeupdate", () => {
            const percent = (audio.currentTime / audio.duration) * 100;
            progressBar.style.width = percent + "%";
            timeDisplay.textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
        });

        audio.addEventListener("loadedmetadata", () => {
            timeDisplay.textContent = `0:00 / ${formatTime(audio.duration)}`;
        });

        progressContainer.addEventListener("click", (e) => {
            const rect = progressContainer.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audio.currentTime = percent * audio.duration;
        });

        // Volume
        volumeSlider.addEventListener("click", (e) => {
            const rect = volumeSlider.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audio.volume = Math.max(0, Math.min(1, percent));
            volumeLevel.style.width = (percent * 100) + "%";
        });

        return playerDiv;
    }

    function updateVisualization(stemName, icon, instruments) {
        const iconDisplay = document.getElementById("iconDisplay");
        const visualizerIcon = document.getElementById("visualizerIcon");
        const stemTitle = document.getElementById("stemTitle");
        const stemSubtitle = document.getElementById("stemSubtitle");
        const waveformContainer = document.getElementById("waveformContainer");
        const currentStemBadge = document.getElementById("currentStemBadge");
        const instrumentsList = document.getElementById("instrumentsList");

        iconDisplay.textContent = icon;
        visualizerIcon.classList.add("playing");
        stemTitle.textContent = stemName.toUpperCase() + " STEM";
        stemSubtitle.textContent = instruments?.length ? `${instruments.length} Instrument${instruments.length !== 1 ? 's' : ''} Active` : "Playing";
        
        waveformContainer.classList.remove("hidden");
        const waveBars = waveformContainer.querySelectorAll(".wave-bar");
        waveBars.forEach(bar => bar.classList.add("active"));
        
        currentStemBadge.classList.remove("hidden");
        currentStemBadge.querySelector("span").textContent = `● ${stemName.toUpperCase()} PLAYING`;
        currentStemBadge.querySelector("span").style.color = "#00FF00";

        if (instruments && instruments.length) {
            instrumentsList.innerHTML = "";
            instruments.forEach(i => {
                const badge = document.createElement("span");
                badge.className = "inline-flex items-center px-4 py-2 rounded-full text-sm font-medium badge";
                badge.style.color = "white";
                badge.innerHTML = `${i.instrument} <span class="ml-2" style="color: #00FF00;">${(i.confidence * 100).toFixed(0)}%</span>`;
                instrumentsList.appendChild(badge);
            });
            instrumentsList.classList.remove("hidden");
        } else {
            instrumentsList.classList.add("hidden");
        }
    }

    function resetVisualization() {
        const iconDisplay = document.getElementById("iconDisplay");
        const visualizerIcon = document.getElementById("visualizerIcon");
        const stemTitle = document.getElementById("stemTitle");
        const stemSubtitle = document.getElementById("stemSubtitle");
        const waveformContainer = document.getElementById("waveformContainer");
        const currentStemBadge = document.getElementById("currentStemBadge");
        const instrumentsList = document.getElementById("instrumentsList");

        iconDisplay.textContent = "🎼";
        visualizerIcon.classList.remove("playing");
        stemTitle.textContent = "Ready to Play";
        stemSubtitle.textContent = "Select a stem to visualize";
        
        waveformContainer.classList.add("hidden");
        const waveBars = waveformContainer.querySelectorAll(".wave-bar");
        waveBars.forEach(bar => bar.classList.remove("active"));
        
        currentStemBadge.classList.add("hidden");
        instrumentsList.classList.add("hidden");
    }

    document.getElementById("analyzeBtn").onclick = async () => {
        if (!filename) {
            alert("No file provided");
            return;
        }

        const analyzeBtn = document.getElementById("analyzeBtn");
        const status = document.getElementById("status");
        const statusText = document.getElementById("statusText");
        const stemsContainer = document.getElementById("stemsContainer");

        analyzeBtn.disabled = true;
        status.classList.remove("hidden");
        statusText.textContent = "Separating stems...";
        stemsContainer.innerHTML = "";

        try {
            const res = await fetch(
                `http://127.0.0.1:8000/analyze/polyphonic/?filename=${filename}`,
                { method: "POST" }
            );

            if (!res.ok) throw new Error(await res.text());
            const result = await res.json();

            statusText.textContent = "Separation complete!";
            setTimeout(() => status.classList.add("hidden"), 3000);

            Object.entries(result.stems).forEach(([name, url]) => {
                const instruments = result.instruments[name] || [];
                const player = createCustomPlayer(name, `http://127.0.0.1:8000${url}`, instruments);
                stemsContainer.appendChild(player);
            });

            analyzeBtn.disabled = false;

        } catch (err) {
            console.error(err);
            statusText.textContent = `Error: ${err.message}`;
            analyzeBtn.disabled = false;
        }
    };
</script>

</body>
</html>
